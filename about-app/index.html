<!DOCTYPE html>
<html lang="es" data-i18n-title="pageTitle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sobre la app | Teclatlon</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container about-app">
    <header class="cabecera-about-app">
      <div class="idioma-selector" role="group" data-i18n-aria="languageAria" aria-label="Elegir idioma">
        <button type="button" class="btn-lang" id="btnLangEs" data-locale="es" aria-pressed="false">🇪🇸 Español</button>
        <button type="button" class="btn-lang" id="btnLangEn" data-locale="en" aria-pressed="false">🇬🇧 English</button>
      </div>
      <img src="../assets/img/icono.svg" alt="" width="64" height="64" class="logo-about-app">
      <h1 data-i18n="title">ℹ️ Sobre la app</h1>
      <p class="entradilla" data-i18n="intro">Teclatlon te ayuda a escribir con el teclado del ordenador. Aquí ves tus logros.</p>
    </header>

    <main class="pila">
      <section id="logros" class="card" aria-labelledby="achievementsTitle">
        <h2 id="achievementsTitle" data-i18n="achievementsTitle">⭐ Logros</h2>
        <p class="help-text" data-i18n="achievementsHint">Los logros se desbloquean automáticamente al practicar.</p>
        <p class="achievements-count" id="achievementsCount" aria-live="polite"></p>
        <ul class="achievements-grid" id="achievementsGrid"></ul>
      </section>

      <p class="pie" data-i18n="savedLocally">Tus logros se guardan solo en este dispositivo.</p>
    </main>

    <footer class="pie-about-app">
      <a class="btn btn-secondary" href="../" data-i18n="footerActivities">Ir a la aplicación</a>
      <a class="btn btn-secondary" href="../config/" data-i18n="core.config">Configuración</a>
    </footer>
  </div>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/achievements.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
